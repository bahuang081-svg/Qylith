<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qylith QuantumShield Bridge - 抗量子跨链桥</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      font-family: 'Inter', system-ui, sans-serif;
      color-scheme: dark;
    }
    
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      color: rgba(255, 255, 255, 0.87);
    }
    
    #root {
      min-height: 100vh;
    }
    
    /* Quantum青蓝渐变 */
    .quantum-gradient {
      background: linear-gradient(135deg, #00D4FF 0%, #7B2FFF 100%);
    }
    
    /* 玻璃态效果 */
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      padding: 1.5rem;
    }
    
    /* 动画 */
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); }
      50% { box-shadow: 0 0 40px rgba(0, 212, 255, 0.6); }
    }
    
    .animate-pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .animate-spin {
      animation: spin 1s linear infinite;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out;
    }
    
    /* 按钮样式 */
    .btn-primary {
      background: linear-gradient(135deg, #00D4FF 0%, #7B2FFF 100%);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    
    /* 输入框 */
    .input-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      padding: 1rem;
      color: white;
      font-size: 1rem;
      transition: all 0.2s;
    }
    
    .input-field:focus {
      outline: none;
      border-color: rgba(0, 212, 255, 0.5);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    }
    
    .input-field::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    
    /* 滚动条 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    
    /* 进度条 */
    .progress-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 0.5s ease;
    }
    
    /* 标签页 */
    .tab-button {
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    
    .tab-button.active {
      background: linear-gradient(135deg, #00D4FF 0%, #7B2FFF 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
    }
    
    .tab-button:not(.active) {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.6);
    }
    
    .tab-button:not(.active):hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }
    
    /* 方向切换按钮 */
    .direction-btn {
      flex: 1;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.6);
    }
    
    .direction-btn.active {
      background: linear-gradient(135deg, #00D4FF 0%, #7B2FFF 100%);
      color: white;
    }
    
    .direction-btn:not(.active):hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }
    
    /* 卡片 */
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      padding: 1rem;
    }
    
    /* 状态徽章 */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
    }
    
    .status-pending { background: rgba(234, 179, 8, 0.2); color: #eab308; }
    .status-processing { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    .status-completed { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
    .status-failed { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    
    /* Logo */
    .logo-icon {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, #00D4FF 0%, #7B2FFF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.25rem;
    }
    
    /* 签名对比卡片 */
    .compare-card {
      border-radius: 1.5rem;
      padding: 1.5rem;
      border: 1px solid;
    }
    
    .ecdsa-card {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.2) 0%, rgba(234, 179, 8, 0.2) 100%);
      border-color: rgba(249, 115, 22, 0.3);
    }
    
    .falcon-card {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.2) 0%, rgba(59, 130, 246, 0.2) 100%);
      border-color: rgba(0, 212, 255, 0.3);
    }
    
    /* 统计卡片 */
    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 1rem;
      padding: 1rem;
      text-align: center;
    }
    
    /* 流程步骤 */
    .flow-step {
      position: relative;
      padding-left: 3.5rem;
    }
    
    .flow-step:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 1.25rem;
      top: 3rem;
      width: 2px;
      height: 2rem;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
    }
    
    .step-icon {
      position: absolute;
      left: 0;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    
    /* 加载遮罩 */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    
    .loading-spinner {
      width: 3rem;
      height: 3rem;
      border: 4px solid rgba(0, 212, 255, 0.3);
      border-top-color: #00D4FF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    /* 警告卡片 */
    .warning-card {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 0.75rem;
      padding: 1rem;
    }
    
    .success-card {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 0.75rem;
      padding: 1rem;
    }
    
    .info-card {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 0.75rem;
      padding: 1rem;
    }
    
    /* 下拉菜单 */
    .dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 0.5rem;
      background: #1e1b4b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      overflow: hidden;
      z-index: 10;
    }
    
    .dropdown-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
      background: none;
      color: white;
    }
    
    .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    /* 链标签 */
    .chain-tag {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
    }
    
    .chain-eth { background: rgba(249, 115, 22, 0.2); color: #f97316; }
    .chain-qylith { background: rgba(0, 212, 255, 0.2); color: #00D4FF; }
    
    /* 响应式 */
    @media (max-width: 768px) {
      .container {
        padding-left: 1rem;
        padding-right: 1rem;
      }
      
      .grid-2 {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // ==================== 常量定义 ====================
    
    const TOKENS = [
      { symbol: 'ETH', name: 'Ethereum', icon: 'Ξ', gradient: 'linear-gradient(135deg, #f97316, #eab308)' },
      { symbol: 'wETH', name: 'Wrapped Ether', icon: 'Ξ', gradient: 'linear-gradient(135deg, #fb923c, #facc15)' },
      { symbol: 'USDC', name: 'USD Coin', icon: '$', gradient: 'linear-gradient(135deg, #3b82f6, #06b6d4)' },
      { symbol: 'USDT', name: 'Tether', icon: '$', gradient: 'linear-gradient(135deg, #22c55e, #14b8a6)' }
    ];
    
    const SIGNATURE_DATA = {
      ecdsa: {
        algorithm: 'ECDSA (secp256k1)',
        signatureSize: 65,
        publicKeySize: 33,
        securityLevel: '128-bit',
        quantumResistant: false
      },
      falcon: {
        algorithm: 'FALCON-1024',
        signatureSize: 666,
        publicKeySize: 897,
        securityLevel: '256-bit',
        quantumResistant: true
      }
    };
    
    const STATUS_CONFIG = {
      PENDING: { label: 'Pending', color: '#eab308', icon: '⏳' },
      PROCESSING: { label: 'Processing', color: '#3b82f6', icon: '⚙️' },
      COMPLETED: { label: 'Completed', color: '#22c55e', icon: '✅' },
      FAILED: { label: 'Failed', color: '#ef4444', icon: '❌' }
    };
    
    const ALGORITHM_INFO = {
      ecdsa: {
        name: 'ECDSA',
        description: 'Elliptic Curve Digital Signature Algorithm',
        vulnerability: 'Vulnerable to Shor\'s algorithm on quantum computers',
        howItWorks: [
          'Key generation: Select a point G on the elliptic curve',
          'Signing: Calculate r = x-coordinate of kG, s = k⁻¹(H(m) + dr) mod n',
          'Verification: Check if r and s satisfy the curve equation'
        ]
      },
      falcon: {
        name: 'FALCON-1024',
        description: 'Fast Fourier Lattice-based Compact Signatures over NTRU',
        vulnerability: 'Resistant to both classical and quantum attacks',
        howItWorks: [
          'Key generation: Create NTRU lattice with secret trapdoor (f, F)',
          'Hashing: Compute c = HashToCone(message)',
          'Sampling: Use trapdoor to sample s from the lattice near c',
          'Verification: Check ||s|| ≤ β and c = Hash(message || s)'
        ]
      }
    };
    
    // ==================== 子组件 ====================
    
    // 钱包状态徽章
    function WalletBadge({ chain, connected, address, balance, onConnect, onDisconnect }) {
      const shortAddress = address ? `${address.slice(0, 6)}...${address.slice(-4)}` : '';
      
      return (
        <div className="flex items-center gap-3">
          {connected ? (
            <>
              <div className="glass rounded-xl px-4 py-2">
                <div className="flex items-center gap-3">
                  <div className={`w-8 h-8 rounded-full ${chain === 'Ethereum' ? 'bg-gradient-to-r from-orange-500 to-yellow-500' : 'quantum-gradient'} flex items-center justify-center text-sm font-bold`}>
                    {chain === 'Ethereum' ? 'Ξ' : 'Q'}
                  </div>
                  <div>
                    <div className="text-sm text-white font-mono">{shortAddress}</div>
                    <div className="text-xs text-gray-400">{balance || '0'} {chain === 'Ethereum' ? 'ETH' : 'QYL'}</div>
                  </div>
                </div>
              </div>
              <button onClick={onDisconnect} className="text-gray-400 hover:text-white transition">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </>
          ) : (
            <button onClick={onConnect} className="btn-primary text-sm">
              Connect {chain}
            </button>
          )}
        </div>
      );
    }
    
    // Tab按钮
    function TabButton({ active, onClick, color, children }) {
      return (
        <button onClick={onClick} className={`tab-button ${active ? 'active' : ''}`}>
          {children}
        </button>
      );
    }
    
    // 统计卡片
    function StatCard({ label, value, icon }) {
      return (
        <div className="stat-card">
          <div className="text-2xl mb-1">{icon}</div>
          <div className="text-2xl font-bold text-white">{value}</div>
          <div className="text-xs text-gray-400">{label}</div>
        </div>
      );
    }
    
    // 转账卡片
    function TransferCard({ transfer }) {
      const config = STATUS_CONFIG[transfer.status];
      const isE2Q = transfer.direction === 'E2Q';
      const progress = transfer.status === 'COMPLETED' ? 100 : 
                      transfer.status === 'PROCESSING' ? 66 :
                      transfer.status === 'PENDING' ? 33 : 0;
      
      return (
        <div className="card animate-fade-in">
          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-3">
              <div className={`w-10 h-10 rounded-lg flex items-center justify-center font-bold text-sm ${
                isE2Q ? 'bg-gradient-to-r from-orange-500 to-yellow-500' : 'bg-gradient-to-r from-purple-500 to-pink-500'
              }`}>
                {isE2Q ? 'E→Q' : 'Q→E'}
              </div>
              <div>
                <div className="text-white font-medium">{transfer.amount} {transfer.token || 'ETH'}</div>
                <div className="text-xs text-gray-400">
                  {new Date(transfer.timestamp).toLocaleString('zh-CN')}
                </div>
              </div>
            </div>
            <div className={`status-badge`} style={{ background: `${config.color}20`, color: config.color }}>
              <span>{config.icon}</span>
              <span>{config.label}</span>
            </div>
          </div>
          <div className="progress-bar">
            <div className="progress-fill" style={{ width: `${progress}%`, background: config.color }}></div>
          </div>
          {transfer.txHash && (
            <div className="mt-2 flex items-center gap-2">
              <span className="text-xs text-gray-500">TX:</span>
              <span className="text-xs text-cyan-400 font-mono">
                {transfer.txHash.slice(0, 10)}...{transfer.txHash.slice(-8)}
              </span>
            </div>
          )}
        </div>
      );
    }
    
    // 空状态
    function EmptyState() {
      return (
        <div className="text-center py-12">
          <div className="text-5xl mb-4">🌉</div>
          <h4 className="text-white font-bold mb-2">No Transfers Yet</h4>
          <p className="text-gray-400 text-sm">
            Start a cross-chain transfer to see it here
          </p>
        </div>
      );
    }
    
    // 签名流程图
    function SignatureFlow({ signatureData }) {
      const steps = [
        { id: 1, title: 'User Signs', description: 'User signs with wallet', chain: 'Ethereum', algorithm: signatureData.ecdsa.algorithm, icon: '🔏', gradient: 'linear-gradient(135deg, #f97316, #eab308)' },
        { id: 2, title: 'ECDSA Verify', description: 'Verify Ethereum signature', chain: 'Ethereum', algorithm: signatureData.ecdsa.algorithm, icon: '✓', gradient: 'linear-gradient(135deg, #fb923c, #facc15)' },
        { id: 3, title: 'FALCON Sign', description: 'Generate quantum-safe proof', chain: 'Qylith', algorithm: signatureData.falcon.algorithm, icon: '🔐', gradient: 'linear-gradient(135deg, #00D4FF, #3b82f6)' },
        { id: 4, title: 'Cross-Chain Mint', description: 'Mint wrapped assets', chain: 'Qylith', algorithm: 'Quantum-Resistant', icon: '🎉', gradient: 'linear-gradient(135deg, #22c55e, #10b981)' }
      ];
      
      return (
        <div className="space-y-4">
          {steps.map((step, index) => (
            <div key={step.id} className="flow-step">
              <div className="step-icon" style={{ background: step.gradient }}>
                {step.icon}
              </div>
              <div className="bg-white/5 rounded-xl p-4">
                <div className="flex items-center justify-between mb-2">
                  <h4 className="text-white font-bold">{step.title}</h4>
                  <span className={`chain-tag ${step.chain === 'Ethereum' ? 'chain-eth' : 'chain-qylith'}`}>
                    {step.chain}
                  </span>
                </div>
                <p className="text-gray-400 text-sm mb-2">{step.description}</p>
                <div className="flex items-center gap-2">
                  <span className="text-xs text-gray-500">Algorithm:</span>
                  <span className={`text-xs font-mono ${step.chain === 'Ethereum' ? 'text-orange-400' : 'text-cyan-400'}`}>
                    {step.algorithm}
                  </span>
                  {step.id === 3 && (
                    <span className="text-xs text-green-400">🛡️ Quantum-Safe</span>
                  )}
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    }
    
    // 跨链状态组件
    function CrossChainStatus({ transfers, signatureData }) {
      return (
        <div className="space-y-6">
          {/* 实时签名状态 */}
          <div className="glass-card">
            <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
              <span>🔐</span>
              <span>Signature Verification Status</span>
            </h3>
            <SignatureFlow signatureData={signatureData} />
          </div>
          
          {/* 转账历史 */}
          <div className="glass-card">
            <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
              <span>📜</span>
              <span>Transfer History</span>
            </h3>
            {transfers.length === 0 ? (
              <EmptyState />
            ) : (
              <div className="space-y-4">
                {transfers.map((transfer) => (
                  <TransferCard key={transfer.id} transfer={transfer} />
                ))}
              </div>
            )}
          </div>
          
          {/* 统计信息 */}
          {transfers.length > 0 && (
            <div className="glass-card">
              <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <span>📊</span>
                <span>Statistics</span>
              </h3>
              <div className="grid grid-cols-2 gap-4" style={{ display: 'grid' }}>
                <StatCard label="Total Transfers" value={transfers.length} icon="🌉" />
                <StatCard label="Completed" value={transfers.filter(t => t.status === 'COMPLETED').length} icon="✅" />
                <StatCard label="Processing" value={transfers.filter(t => t.status === 'PROCESSING').length} icon="⚙️" />
                <StatCard label="Failed" value={transfers.filter(t => t.status === 'FAILED').length} icon="❌" />
              </div>
            </div>
          )}
        </div>
      );
    }
    
    // 桥接表单组件
    function BridgeForm({ wallet, onTransfer, isLoading }) {
      const [direction, setDirection] = useState('E2Q');
      const [amount, setAmount] = useState('');
      const [selectedToken, setSelectedToken] = useState('ETH');
      const [showTokenSelector, setShowTokenSelector] = useState(false);
      const dropdownRef = useRef(null);
      
      const currentToken = TOKENS.find(t => t.symbol === selectedToken) || TOKENS[0];
      const maxAmount = direction === 'E2Q' ? (wallet.ethereum.balance || '0') : (wallet.qylith.balance || '0');
      
      useEffect(() => {
        function handleClickOutside(event) {
          if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
            setShowTokenSelector(false);
          }
        }
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);
      
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!amount || parseFloat(amount) <= 0) return;
        if (direction === 'E2Q' && !wallet.ethereum.connected) {
          alert('Please connect your Ethereum wallet first');
          return;
        }
        if (direction === 'Q2E' && !wallet.qylith.connected) {
          alert('Please connect your Qylith wallet first');
          return;
        }
        onTransfer(direction, amount, selectedToken);
      };
      
      return (
        <div className="space-y-6">
          <div className="text-center">
            <h2 className="text-2xl font-bold text-white mb-2">Cross-Chain Transfer</h2>
            <p className="text-gray-400">Transfer assets between Ethereum and Qylith</p>
          </div>
          
          {/* 方向切换 */}

            ...prev,

              connected: true,
              address: '0x742d35Cc6634C0532925a3b844Bc9e7595f2bD6e',
              balance: '1.2345'
            }
          }));
          setIsLoading(false);
        }, 500);

        setIsLoading(true);
        setTimeout(() => {
          setWallet(prev => ({
            ...prev,
            qylith: {
              connected: true,
              address: '5CmA3nYwC1vwdzF2o6r6H8tL3rJk9Fg5tX4bN7vR4mP2qK9d',
              balance: '500.00'
            }
          }));
          setIsLoading(false);
        }, 500);
      };

        setWallet(prev => ({
          ...prev,
          ethereum: { connected: false, address: null, balance: null }
        }));
      };

      };

        setIsLoading(true);
        setError(null);
        
        const record = {
          id: `tx_${Date.now()}`,
          direction,
          amount,
          token,
          status: 'PENDING',
          timestamp: Date.now()
        };
        
        setTransfers(prev => [record, ...prev]);
        
        // 模拟处理过程
        setTimeout(() => {
          record.status = 'PROCESSING';
          setTransfers(prev => prev.map(t => t.id === record.id ? record : t));
        }, 1000);
        
        setTimeout(() => {
          record.status = 'PROCESSING';
          setTransfers(prev => prev.map(t => t.id === record.id ? record : t));
        }, 2000);
        
        setTimeout(() => {
          record.status = 'COMPLETED';
          record.txHash = '0x' + Math.random().toString(16).slice(2).padEnd(64, '0');
          setTransfers(prev => prev.map(t => t.id === record.id ? record : t));

                  />
                </div>
                
                {/* 右侧：状态 */}
                <div className="space-y-6">
                  <CrossChainStatus
                    transfers={transfers}
                    signatureData={SIGNATURE_DATA}
                  />
                </div>
              </div>
            )}
            
            {activeTab === 'compare' && (
              <SignatureCompare data={SIGNATURE_DATA} />
            )}
          </main>
          
          {/* 加载指示器 */}
          {isLoading && (
            <div className="loading-overlay">
              <div className="glass-card text-center">
                <div className="loading-spinner mx-auto mb-4"></div>
                <p className="text-white">Processing cross-chain transfer...</p>
              </div>
            </div>
          )}
        </div>
      );
    }
    
    // 渲染应用
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
