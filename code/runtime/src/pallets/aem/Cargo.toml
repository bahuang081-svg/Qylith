[package]
name = "pallet-aem"
version = "0.1.0"
edition = "2021"
authors = ["Qylith Team"]
description = "AI Agent Execution Module (AEM) - Core pallet for AI-native blockchain operations"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# Substrate frame
frame-benchmarking = { git = "https://github.com/parity-tech/substrate.git", branch = "polkadot-v1.0.0", default-features = false }
frame-support = { git = "https://github.com/parity-tech/substrate.git", branch = "polkadot-v1.0.0", default-features = false }
frame-system = { git = "https://github.com/parity-tech/substrate.git", branch = "polkadot-v1.0.0", default-features = false }
frame-try-runtime = { git = "https://github.com/parity-tech/substrate.git", branch = "polkadot-v1.0.0", default-features = false }

# Substrate primitives
sp-runtime = { git = "https://github.com/parity-tech/substrate.git", branch = "polkadot-v1.0.0", default-features = false }
sp-std = { git = "https://github.com/parity-tech/substrate.git", branch = "polkadot-v1.0.0", default-features = false }
sp-core = { git = "https://github.com/parity-tech/substrate.git", branch = "polkadot-v1.0.0", default-features = false }
sp-application-crypto = { git = "https://github.com/parity-tech/substrate.git", branch = "polkadot-v1.0.0", default-features = false }

# Codec
codec = { package = "parity-scale-codec", version = "3.6", features = ["derive", "max-encoded-len"] }
scale-info = { version = "2.10", features = ["derive"] }

# Qylith primitives
qylith-primitives = { path = "../../../../primitives/crypto", default-features = false }

# Additional utilities
log = "0.4"
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
sp-core = { git = "https://github.com/parity-tech/substrate.git", branch = "polkadot-v1.0.0" }
sp-io = { git = "https://github.com/parity-tech/substrate.git", branch = "polkadot-v1.0.0" }
pallet-balances = { git = "https://github.com/parity-tech/substrate.git", branch = "polkadot-v1.0.0" }

[features]
default = ["std"]
std = [
    "frame-benchmarking/std",
    "frame-support/std",
    "frame-system/std",
    "frame-try-runtime/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-core/std",
    "sp-application-crypto/std",
    "codec/std",
    "scale-info/std",
    "qylith-primitives/std",
    "serde",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-system-benchmarking/runtime-benchmarks",
]
try-runtime = [
    "frame-try-runtime/try-runtime",
    "frame-support/try-runtime",
]
