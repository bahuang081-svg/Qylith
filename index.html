<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Qylith 游戏厅，打开就能玩的轻量小游戏合集。">
  <title>Qylith 游戏厅</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">qylith.xyz</p>
        <h1>Qylith 游戏厅</h1>
        <p class="lead">三个随手开局的小游戏，手机和电脑都能玩，分数只保存在本机。</p>
      </div>
      <div class="today-panel" aria-live="polite">
        <span class="panel-label">今日最佳</span>
        <strong id="todayBest">0</strong>
        <span id="todayGame">还没有战绩</span>
      </div>
    </section>

    <nav class="game-switch" aria-label="选择游戏">
      <button class="game-tab is-active" type="button" data-game="tap">
        <span>快点泡泡</span>
        <small>20 秒反应</small>
      </button>
      <button class="game-tab" type="button" data-game="memory">
        <span>记忆翻牌</span>
        <small>8 组配对</small>
      </button>
      <button class="game-tab" type="button" data-game="color">
        <span>色彩急转</span>
        <small>12 轮判断</small>
      </button>
    </nav>

    <div class="play-layout">
      <section class="arena" aria-label="游戏区">
        <header class="arena-head">
          <div>
            <p class="mode-label" id="modeLabel">反应</p>
            <h2 id="gameTitle">快点泡泡</h2>
            <p id="gameHint">看见亮起的泡泡就点它，连击会加分。</p>
          </div>
          <button class="primary-action" id="startBtn" type="button">开始</button>
        </header>

        <div class="score-strip" aria-live="polite">
          <div>
            <span>本局</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div>
            <span id="metricLabel">连击</span>
            <strong id="metricValue">0</strong>
          </div>
          <div>
            <span>剩余</span>
            <strong id="timeValue">20</strong>
          </div>
          <div>
            <span>最高</span>
            <strong id="bestValue">0</strong>
          </div>
        </div>

        <p class="status-line" id="statusLine">选一个游戏，然后开始。</p>

        <section class="game-pane" id="tapPane" aria-label="快点泡泡">
          <div class="tap-board" id="tapBoard"></div>
        </section>

        <section class="game-pane" id="memoryPane" aria-label="记忆翻牌" hidden>
          <div class="memory-board" id="memoryBoard"></div>
        </section>

        <section class="game-pane" id="colorPane" aria-label="色彩急转" hidden>
          <div class="color-stage">
            <div class="target-swatch" id="targetSwatch"></div>
            <div class="color-copy">
              <span id="roundValue">第 1 轮</span>
              <strong id="targetName">珊瑚红</strong>
            </div>
          </div>
          <div class="color-choices" id="colorChoices"></div>
        </section>
      </section>

      <aside class="scoreboard" aria-label="排行榜">
        <header class="board-head">
          <div>
            <p class="mode-label">本机记录</p>
            <h2>排行榜</h2>
          </div>
          <button class="ghost-action" id="clearBtn" type="button">清空</button>
        </header>
        <div class="best-list" id="bestList"></div>
        <h3>最近战绩</h3>
        <ol class="recent-list" id="recentList"></ol>
      </aside>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
